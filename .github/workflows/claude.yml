name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only run if the comment contains @claude or the issue is assigned to claude[bot]
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'assigned' && github.event.assignee.login == 'claude[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Limit Claude to documentation tasks only — no pushing to main
          allowed_tools: >
            Bash(git status),
            Bash(git diff),
            Bash(git log),
            Bash(git checkout -b *),
            Bash(git add *),
            Bash(git commit *),
            Bash(git push origin feat/*),
            Bash(git push origin fix/*),
            Bash(git push origin chore/*),
            Bash(mintlify dev),
            Read,
            Write,
            Edit,
            Glob,
            Grep,
            WebFetch
          # Safety: never allow pushing to main
          disallowed_tools: >
            Bash(git push origin main),
            Bash(git push --force *),
            Bash(git reset --hard *),
            Bash(rm -rf *)
          custom_instructions: |
            You are a documentation assistant for the Reqlick API docs repo.
            This repo uses Mintlify (mint.json) and deploys to docs.reqlick.com.

            CRITICAL RULES:
            - Never push to main — use feat/, fix/, or chore/ branches only
            - Never invent endpoint paths — verify against https://prod-service.reqlick.com/openapi.json
            - Never delete existing endpoint .mdx pages without explicit approval
            - Never remove entries from mint.json navigation without explicit approval
            - All new endpoint pages must follow the frontmatter-only format:
              title, openapi (METHOD /path), description

            When adding new endpoint pages, always update mint.json navigation too.
            When done with changes, create a PR with a clear summary of what was changed.
